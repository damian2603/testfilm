<!doctype html>
<html lang="pl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#111111">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Chained Together">
  <title>Chained Together</title>
  <style>
    :root { color-scheme: dark; font-family: -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; }
    * { box-sizing: border-box; }
    body { margin: 0; background:#0b0b0c; color:#f5f5f7; min-height:100vh; }
    main { max-width: 960px; margin:0 auto; padding: max(18px,env(safe-area-inset-top)) 14px max(24px,env(safe-area-inset-bottom)); }
    h1 { font-size:1.35rem; margin:0 0 14px; }
    .player { background:#000; border-radius:14px; overflow:hidden; box-shadow:0 8px 28px #0008; }
    video { display:block; width:100%; max-height:72vh; background:#000; }
    .panel { margin-top:14px; display:grid; gap:10px; }
    .row { display:grid; grid-template-columns:1fr auto auto; gap:8px; }
    select,button { min-height:46px; border:0; border-radius:11px; font-size:16px; padding:0 14px; background:#232326; color:#fff; }
    button { cursor:pointer; font-weight:600; }
    button:active { transform:scale(.98); }
    .primary { background:#f5f5f7; color:#111; }
    .status { color:#a9a9b2; font-size:.88rem; line-height:1.4; padding:2px 2px 0; }
    .links { display:flex; flex-wrap:wrap; gap:8px; }
    .links a { color:#d7d7dc; background:#1a1a1d; padding:9px 11px; border-radius:9px; text-decoration:none; font-size:.88rem; }
    @media (max-width:560px){ .row{grid-template-columns:1fr 1fr}.row select{grid-column:1/-1} }
  </style>
</head>
<body>
<main>
  <h1>Chained Together — PL</h1>

  <div class="player">
    <video id="video" controls playsinline webkit-playsinline crossorigin="anonymous" preload="metadata"></video>
  </div>

  <div class="panel">
    <div class="row">
      <select id="episode" aria-label="Wybierz odcinek"></select>
      <button id="prev">← Poprzedni</button>
      <button id="next" class="primary">Następny →</button>
    </div>

    <div class="links">
      <a id="videoLink" href="#" target="_blank" rel="noopener">M3U8</a>
      <a id="subLink" href="#" target="_blank" rel="noopener">Napisy VTT</a>
    </div>

    <div id="status" class="status">Ładowanie…</div>
  </div>
</main>

<script>
(() => {
  const VIDEO_BASE = 'https://cdn.my-muse.ai/convert/chained-together/en/20261002-215908z-c85b51b3';
  const SUB_BASE = 'https://cdn.my-muse.ai/originals/chained-together/subtitles/20261002-221821z-72ae5e3e/pl';
  const MAX_EP = 21;

  const video = document.getElementById('video');
  const episode = document.getElementById('episode');
  const prev = document.getElementById('prev');
  const next = document.getElementById('next');
  const status = document.getElementById('status');
  const videoLink = document.getElementById('videoLink');
  const subLink = document.getElementById('subLink');

  for (let i = 1; i <= MAX_EP; i++) {
    const o = document.createElement('option');
    o.value = i;
    o.textContent = `Odcinek ${i}`;
    episode.appendChild(o);
  }

  function urls(n) {
    return {
      video: `${VIDEO_BASE}/ep${n}_.m3u8`,
      subs: `${SUB_BASE}/ep${n}.vtt`
    };
  }

  function showSubtitles() {
    try {
      for (let i = 0; i < video.textTracks.length; i++) {
        video.textTracks[i].mode = i === 0 ? 'showing' : 'disabled';
      }
      status.textContent = video.textTracks.length
        ? 'Polskie napisy: włączone automatycznie.'
        : 'Odtwarzacz nie zgłosił jeszcze ścieżki napisów.';
    } catch (e) {
      status.textContent = 'Film gotowy. Jeśli napisy są wyłączone, wybierz „Polski” w menu napisów odtwarzacza.';
    }
  }

  function loadEpisode(n, autoplay = false) {
    n = Math.min(MAX_EP, Math.max(1, Number(n) || 1));
    const u = urls(n);

    video.pause();
    video.innerHTML = '';

    const source = document.createElement('source');
    source.src = u.video;
    source.type = 'application/vnd.apple.mpegurl';

    const track = document.createElement('track');
    track.kind = 'subtitles';
    track.label = 'Polski';
    track.srclang = 'pl';
    track.src = u.subs;
    track.default = true;

    video.append(source, track);
    video.load();

    episode.value = String(n);
    prev.disabled = n <= 1;
    next.disabled = n >= MAX_EP;
    videoLink.href = u.video;
    subLink.href = u.subs;
    status.textContent = `Ładowanie odcinka ${n}…`;

    localStorage.setItem('chained-episode', String(n));
    const q = new URL(location.href);
    q.searchParams.set('ep', n);
    history.replaceState(null, '', q);

    video.addEventListener('loadedmetadata', () => {
      showSubtitles();
      if (autoplay) video.play().catch(() => {});
    }, { once: true });

    track.addEventListener('load', showSubtitles, { once: true });
    track.addEventListener('error', () => {
      status.textContent = 'Nie udało się automatycznie wczytać VTT. Możliwe, że CDN blokuje CORS dla napisów.';
    }, { once: true });
  }

  episode.addEventListener('change', () => loadEpisode(episode.value, true));
  prev.addEventListener('click', () => loadEpisode(Number(episode.value) - 1, true));
  next.addEventListener('click', () => loadEpisode(Number(episode.value) + 1, true));
  video.addEventListener('ended', () => {
    const n = Number(episode.value);
    if (n < MAX_EP) loadEpisode(n + 1, true);
  });

  const epFromUrl = new URLSearchParams(location.search).get('ep');
  const saved = localStorage.getItem('chained-episode');
  loadEpisode(epFromUrl || saved || 1);
})();
</script>
</body>
</html>
